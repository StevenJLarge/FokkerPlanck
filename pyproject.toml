[project]
name = "fokker_planck"
version = "1.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flake8>=7.3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
fokker-planck = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "fokker-planck",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["fokker_planck*"]
